<defs>
  <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a8ff00" stop-opacity="0"/>
    <stop offset="0.85" stop-color="#a8ff00" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#d4ff66" stop-opacity="0.7"/>
  </linearGradient>
  <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="1"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <mask id="gridMask"><rect x="0" y="380" width="640" height="50" fill="url(#gridFade)"/></mask>
  <clipPath id="building">
    <rect x="30" y="185" width="580" height="195"/>
    <rect x="215" y="150" width="210" height="230"/>
    <rect x="250" y="122" width="140" height="30"/>
  </clipPath>
</defs>
<style>
  .draw { stroke: #a8ff00; stroke-width: 1.4; stroke-dasharray: 1; stroke-dashoffset: 1;
          animation: draw 2.4s ease-out forwards; }
  .thin { stroke-width: 0.8; stroke-opacity: 0.6; }
  .win { stroke: #86cc00; stroke-width: 0.8; stroke-opacity: 0.55; fill: #a8ff00; fill-opacity: 0;
         opacity: 0; animation: appear 0.8s 1.6s forwards; }
  .f1 { animation: appear 0.8s 1.6s forwards, lit 7s 2.4s infinite; }
  .f2 { animation: appear 0.8s 1.6s forwards, lit 9s 3.1s infinite; }
  .f3 { animation: appear 0.8s 1.6s forwards, lit 11s 4.0s infinite; }
  .f4 { animation: appear 0.8s 1.6s forwards, lit 6s 5.2s infinite; }
  .f5 { animation: appear 0.8s 1.6s forwards, lit 13s 2.0s infinite; }
  .f6 { animation: appear 0.8s 1.6s forwards, lit 8s 6.5s infinite; }
  .grid { stroke: #86cc00; stroke-width: 0.7; stroke-opacity: 0.5; }
  .grid-move { animation: grid 2.5s linear infinite; }
  .scan { animation: scan 6s 2.4s linear infinite; transform: translateY(-80px); }
  .flag { fill: #a8ff00; fill-opacity: 0.25; stroke: #a8ff00; stroke-width: 1; opacity: 0;
          animation: appear 0.8s 2s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes appear { to { opacity: 1; } }
  @keyframes lit { 0%, 55%, 100% { fill-opacity: 0; } 60%, 90% { fill-opacity: 0.45; } 62% { fill-opacity: 0.1; } }
  @keyframes grid { to { transform: translateY(12px); } }
  @keyframes scan { from { transform: translateY(-80px); } to { transform: translateY(380px); } }
  @media (prefers-reduced-motion: reduce) {
    .draw { animation: none; stroke-dashoffset: 0; }
    .win, .flag { animation: none; opacity: 1; }
    .grid-move, .scan { animation: none; }
    .scan { display: none; }
  }
</style>
